<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSIT Notice Matcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e3e1db;
  --ink: #1c1b18;
  --muted: #6f6c63;
  --accent: #1f5f4f;
  --accent-fg: #ffffff;
  --tag-bg: #eaf1ee;
  --tag-fg: #1f5f4f;
  --good: #1f7a4d;
  --good-bg: #e6f2ea;
  --warn: #a6660a;
  --warn-bg: #fbf0dd;
  --low: #8b8779;
  --low-bg: #eeecE4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15160f;
    --surface: #1d1e16;
    --border: #34352a;
    --ink: #ece9df;
    --muted: #9d9a8d;
    --accent: #6fbf9e;
    --accent-fg: #0b1a14;
    --tag-bg: #1f2a22;
    --tag-fg: #8fd6b6;
    --good: #6fbf9e;
    --good-bg: #17281f;
    --warn: #e0a94a;
    --warn-bg: #2b2214;
    --low: #7c7a6e;
    --low-bg: #232319;
  }
}
:root[data-theme="dark"] {
  --bg: #15160f;
  --surface: #1d1e16;
  --border: #34352a;
  --ink: #ece9df;
  --muted: #9d9a8d;
  --accent: #6fbf9e;
  --accent-fg: #0b1a14;
  --tag-bg: #1f2a22;
  --tag-fg: #8fd6b6;
  --good: #6fbf9e;
  --good-bg: #17281f;
  --warn: #e0a94a;
  --warn-bg: #2b2214;
  --low: #7c7a6e;
  --low-bg: #232319;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", "Noto Sans KR", -apple-system, sans-serif;
  padding: 40px 24px 80px;
}

.wrap { max-width: 1200px; margin: 0 auto; }

.layout { display: flex; gap: 28px; align-items: flex-start; }
.main { flex: 1; min-width: 0; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  position: sticky;
  top: 24px;
}
.sidebar h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0 0 12px;
}
.company-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.company-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  padding: 9px 11px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 13px;
}
.company-item.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--surface));
}
.company-item .name { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company-item .del {
  color: var(--muted);
  font-size: 12px;
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px 4px;
  flex-shrink: 0;
}
.company-item .del:hover { color: #b23b3b; }
.company-item.all { font-weight: 600; }

.sidebar-actions { display: flex; flex-direction: column; gap: 6px; }
.sidebar-actions button {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.sidebar-actions button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.company-form {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.company-form[hidden] { display: none; }
.company-form input, .company-form textarea {
  padding: 7px 9px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  font-size: 12.5px;
  font-family: inherit;
  resize: vertical;
}
.company-form .row { display: flex; gap: 6px; }
.company-form .row > * { flex: 1; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; position: static; }
}

header { margin-bottom: 28px; }
.eyebrow {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin: 0 0 6px;
}
h1 {
  font-family: "Space Grotesk", "Noto Sans KR", sans-serif;
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 6px;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
.sub { color: var(--muted); font-size: 14px; margin: 0; }

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 24px 0 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tab:hover { border-color: var(--accent); }
.tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

select#companyFilter {
  margin-left: auto;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  max-width: 220px;
}

.list { display: flex; flex-direction: column; gap: 10px; }

.card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  padding: 16px 18px;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.card a.title {
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
}
.card a.title:hover { color: var(--accent); text-decoration: underline; }

.meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-fg);
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
}
.badge.dday {
  background: var(--warn-bg);
  color: var(--warn);
  font-family: "Space Grotesk", sans-serif;
  font-variant-numeric: tabular-nums;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
}
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-pill.open { background: var(--good-bg); color: var(--good); }
.status-pill.upcoming { background: var(--warn-bg); color: var(--warn); }
.status-pill.closed { background: var(--low-bg); color: var(--low); }
.status-pill.unknown { background: var(--low-bg); color: var(--low); }

.score {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  flex-shrink: 0;
}
.score.high { color: var(--good); }
.score.mid { color: var(--warn); }
.score.low { color: var(--low); }
.score .num { font-size: 17px; }

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px 16px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.fact { font-size: 12.5px; line-height: 1.4; }
.fact-label {
  color: var(--muted);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: block;
  margin-bottom: 2px;
}
.fact-value { color: var(--ink); font-variant-numeric: tabular-nums; }

.rationale {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  line-height: 1.5;
}
.notes {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 8px;
  font-style: italic;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 48px 0;
  text-align: center;
}

.search-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.search-row input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
}
.search-row input::placeholder { color: var(--muted); }
.search-row button {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.search-row button.ghost {
  background: var(--surface);
  color: var(--muted);
  border-color: var(--border);
  font-weight: 500;
}
.search-status {
  color: var(--muted);
  font-size: 12.5px;
  margin: 10px 0 -6px;
}

.pagination {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.page-info { color: var(--muted); font-size: 12.5px; }
.page-buttons { display: flex; gap: 4px; align-items: center; }
.page-btn {
  min-width: 30px;
  height: 30px;
  padding: 0 6px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
}
.page-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.page-btn:disabled { opacity: 0.4; cursor: default; }
.page-ellipsis { color: var(--muted); padding: 0 2px; font-size: 12.5px; }

@media (max-width: 520px) {
  select#companyFilter { margin-left: 0; width: 100%; }
  .search-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Sparklabs · Portfolio Intelligence</p>
    <h1>MSIT Notice Matcher</h1>
    <p class="sub">과학기술정보통신부 사업공고를 자동 수집하고, 예산·자격·마감일을 추출해 포트폴리오사와의 적합도를 AI로 채점합니다.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>포트폴리오사</h2>
      <div class="company-list" id="companyList">
        <div class="company-item all active" data-id="">전체 공고 보기</div>
      </div>
      <div class="sidebar-actions">
        <button id="addCompanyBtn" type="button">+ 회사 추가</button>
        <button id="runMatchBtn" type="button" class="primary">매칭 실행</button>
      </div>
      <div class="company-form" id="companyForm" hidden>
        <p style="font-size:11.5px;color:var(--muted);margin:0 0 2px;line-height:1.5;">한 줄에 한 회사씩, <strong>회사명: 회사 소개</strong> 형식으로 붙여넣으세요. 소개가 구체적일수록 매칭이 정확해집니다.</p>
        <textarea id="cfBulk" placeholder="예)
Acme Inc.: GPU 클라우드 인프라를 제공하는 AI 스타트업
Beta Corp.: 블록체인 기반 결제 솔루션 스타트업" rows="6"></textarea>
        <div class="row">
          <button type="button" id="cfSave" class="primary" style="border:1px solid var(--accent);border-radius:8px;padding:7px;font-weight:600;cursor:pointer;">추가</button>
          <button type="button" id="cfCancel" style="border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--bg);cursor:pointer;">취소</button>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="무엇을 찾고 계신가요? (예: GPU 지원, 블록체인 스타트업 바우처, 해외 진출 지원)" />
        <button id="searchBtn" type="button">검색</button>
        <button id="searchClearBtn" type="button" class="ghost" hidden>지우기</button>
      </div>

      <div class="controls">
        <div class="tabs" id="statusTabs">
          <button class="tab active" data-status="">전체</button>
          <button class="tab" data-status="open">접수중</button>
          <button class="tab" data-status="closed">마감</button>
        </div>
      </div>

      <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://kxumdmcscyfxxytrugnb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dW1kbWNzY3lmeHh5dHJ1Z25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTQzNDUsImV4cCI6MjEwMjY5MDM0NX0.ptIUfBtvlHiaUVKM10MvxAd0gEyxs3KKozS3FfPqqpk";

let currentStatus = "";
let currentCompany = "";
let activeSearch = null; // { query, results } when a semantic search is active
let currentPage = 1;
const PAGE_SIZE = 20;

async function semanticSearch(query) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/search-notices`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, matchCount: 30 }),
  });
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.results ?? [];
}

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// PostgREST caps each response at 1000 rows regardless of ?limit, so page through
// with Range headers to get everything.
async function sbAll(path) {
  const pageSize = 1000;
  let offset = 0;
  let all = [];
  while (true) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: ANON_KEY,
        Authorization: `Bearer ${ANON_KEY}`,
        Range: `${offset}-${offset + pageSize - 1}`,
      },
    });
    if (!res.ok) throw new Error(await res.text());
    const page = await res.json();
    all = all.concat(page);
    if (page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

function scoreClass(s) {
  if (s >= 70) return "high";
  if (s >= 40) return "mid";
  return "low";
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const statusLabel = { open: "접수중", closed: "마감", unknown: "미확인" };

function computeStatus(n) {
  // Deadlines are real dates, so compute freshness live instead of trusting a status
  // written once at extraction time (which goes stale the moment the deadline passes).
  if (n.application_deadline) {
    const today = new Date().toISOString().slice(0, 10);
    return n.application_deadline >= today ? "open" : "closed";
  }
  return n.application_status === "closed" ? "closed" : "unknown";
}

function dDayLabel(deadline) {
  if (!deadline) return null;
  const msPerDay = 24 * 60 * 60 * 1000;
  const today = new Date(new Date().toISOString().slice(0, 10));
  const due = new Date(deadline);
  const days = Math.round((due - today) / msPerDay);
  if (days < 0) return null;
  return days === 0 ? "D-day" : `D-${days}`;
}

async function sbWrite(path, method, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: ANON_KEY,
      Authorization: `Bearer ${ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

let companies = [];

async function loadCompanies() {
  try {
    companies = await sb("portfolio_companies?select=*&active=eq.true&order=name");
  } catch (e) {
    console.error(e);
    companies = [];
  }
  renderCompanyList();
}

function renderCompanyList() {
  const listEl = document.getElementById("companyList");
  const allActive = currentCompany === "" ? "active" : "";
  listEl.innerHTML =
    `<div class="company-item all ${allActive}" data-id="">전체 공고 보기</div>` +
    companies
      .map(
        (c) => `
      <div class="company-item ${String(c.id) === String(currentCompany) ? "active" : ""}" data-id="${c.id}">
        <span class="name">${escapeHtml(c.name)}</span>
        <button class="del" data-del-id="${c.id}" title="삭제">✕</button>
      </div>`
      )
      .join("");
}

function factRow(label, value) {
  if (!value) return "";
  return `<div class="fact"><span class="fact-label">${escapeHtml(label)}</span><span class="fact-value">${escapeHtml(value)}</span></div>`;
}

async function render() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';

  let notices = [];
  const cutoff = new Date(Date.now() - 1095 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
  try {
    if (activeSearch) {
      notices = activeSearch.results;
    } else if (currentCompany) {
      const matches = await sbAll(
        `notice_matches?select=notice_id,relevance_score,rationale,notices(*)&company_id=eq.${currentCompany}&notices.posted_at=gte.${cutoff}&order=relevance_score.desc`
      );
      notices = matches.filter((m) => m.notices).map((m) => ({ ...m.notices, relevance_score: m.relevance_score, rationale: m.rationale }));
    } else {
      notices = await sbAll(`notices?select=*&posted_at=gte.${cutoff}&order=posted_at.desc`);
    }
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    return;
  }

  if (currentStatus) notices = notices.filter((n) => computeStatus(n) === currentStatus);

  const searchStatusHtml = activeSearch
    ? `<div class="search-status">"${escapeHtml(activeSearch.query)}" 의미 검색 결과 ${notices.length}건</div>`
    : "";

  if (!notices.length) {
    listEl.innerHTML = searchStatusHtml + '<div class="empty">해당하는 공고가 없습니다.</div>';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(notices.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  const pageNotices = notices.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  listEl.innerHTML = searchStatusHtml + pageNotices.map((n) => {
    const status = computeStatus(n);
    const dDay = status === "open" ? dDayLabel(n.application_deadline) : null;
    const facts = [
      factRow("총 사업예산", n.total_budget),
      factRow("기업당 지원한도", n.support_cap_per_company),
      factRow("자기부담 비율", n.self_funding_ratio),
      factRow("실질 지원금액", n.actual_support_amount),
      factRow("지원 형태", n.support_type),
      factRow("지급 방식", n.payment_method),
      factRow("선정 규모", n.selection_scale),
      factRow("사업 수행기간", n.project_period),
      factRow("신청자격", n.eligibility),
      factRow("신청 마감일", n.application_deadline),
    ].join("");

    return `
    <div class="card">
      <div class="card-top">
        <a class="title" href="${escapeHtml(n.detail_url)}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
        ${n.relevance_score != null ? `<span class="score ${scoreClass(n.relevance_score)}"><span class="num">${n.relevance_score}</span>/100</span>` : ""}
      </div>
      <div class="meta">
        <span class="status-pill ${escapeHtml(status)}">${escapeHtml(statusLabel[status] ?? status)}</span>
        ${dDay ? `<span class="badge dday">${escapeHtml(dDay)}</span>` : ""}
        ${n.dept ? `<span>${escapeHtml(n.dept)}</span>` : ""}
        ${n.posted_at ? `<span>${escapeHtml(n.posted_at)}</span>` : ""}
      </div>
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${n.rationale ? `<div class="rationale">${escapeHtml(n.rationale)}</div>` : ""}
      ${n.extraction_notes ? `<div class="notes">${escapeHtml(n.extraction_notes)}</div>` : ""}
    </div>
  `;
  }).join("") + paginationHtml(totalPages, notices.length);
}

function paginationHtml(totalPages, totalCount) {
  if (totalPages <= 1) return "";
  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
      pages.push(p);
    } else if (pages[pages.length - 1] !== "…") {
      pages.push("…");
    }
  }
  const buttons = pages
    .map((p) =>
      p === "…"
        ? `<span class="page-ellipsis">…</span>`
        : `<button class="page-btn ${p === currentPage ? "active" : ""}" data-page="${p}">${p}</button>`
    )
    .join("");
  return `
    <div class="pagination">
      <span class="page-info">전체 ${totalCount}건 · ${currentPage}/${totalPages}페이지</span>
      <div class="page-buttons">
        <button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? "disabled" : ""}>‹</button>
        ${buttons}
        <button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? "disabled" : ""}>›</button>
      </div>
    </div>
  `;
}

document.getElementById("statusTabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
  tab.classList.add("active");
  currentStatus = tab.dataset.status;
  currentPage = 1;
  render();
});

document.getElementById("companyList").addEventListener("click", (e) => {
  const delBtn = e.target.closest(".del");
  if (delBtn) {
    e.stopPropagation();
    deleteCompany(delBtn.dataset.delId);
    return;
  }
  const item = e.target.closest(".company-item");
  if (!item) return;
  currentCompany = item.dataset.id;
  currentPage = 1;
  renderCompanyList();
  render();
});

async function deleteCompany(id) {
  if (!confirm("이 회사를 삭제하시겠습니까? 매칭 기록도 함께 삭제됩니다.")) return;
  try {
    await sbWrite(`portfolio_companies?id=eq.${id}`, "DELETE");
    if (String(currentCompany) === String(id)) currentCompany = "";
    await loadCompanies();
    render();
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
}

document.getElementById("addCompanyBtn").addEventListener("click", () => {
  document.getElementById("companyForm").hidden = false;
});
document.getElementById("cfCancel").addEventListener("click", () => {
  document.getElementById("companyForm").hidden = true;
});
document.getElementById("cfSave").addEventListener("click", async () => {
  const raw = document.getElementById("cfBulk").value;
  const rows = raw
    .split("\n")
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const idx = line.indexOf(":");
      if (idx === -1) return { name: line, description: null };
      return { name: line.slice(0, idx).trim(), description: line.slice(idx + 1).trim() || null };
    })
    .filter((r) => r.name);

  if (!rows.length) {
    alert("회사명을 한 줄 이상 입력해주세요.");
    return;
  }

  try {
    await sbWrite("portfolio_companies", "POST", rows);
    document.getElementById("cfBulk").value = "";
    document.getElementById("companyForm").hidden = true;
    await loadCompanies();
  } catch (e) {
    alert("저장 실패: " + e.message);
  }
});

document.getElementById("runMatchBtn").addEventListener("click", async (e) => {
  const btn = e.target;
  btn.disabled = true;
  const originalText = btn.textContent;
  let totalScored = 0;

  try {
    while (true) {
      btn.textContent = `매칭 실행 중… (${totalScored}건 완료)`;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/match-notices`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ limitPairs: 15 }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (data.message) {
        alert(data.message);
        break;
      }
      totalScored += data.scored ?? 0;
      if (!data.remaining) break;
    }
    alert(`매칭 완료: 총 ${totalScored}건 신규 매칭됨`);
    render();
  } catch (e) {
    alert(`매칭 실행 실패 (지금까지 ${totalScored}건 완료): ` + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

document.getElementById("list").addEventListener("click", (e) => {
  const btn = e.target.closest(".page-btn");
  if (!btn || btn.disabled) return;
  currentPage = parseInt(btn.dataset.page, 10);
  render();
  document.querySelector(".main").scrollIntoView({ behavior: "smooth", block: "start" });
});

async function runSearch() {
  const input = document.getElementById("searchInput");
  const query = input.value.trim();
  if (!query) return;

  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">의미 검색 중…</div>';
  document.getElementById("searchClearBtn").hidden = false;

  try {
    const results = await semanticSearch(query);
    activeSearch = { query, results };
    currentPage = 1;
  } catch (e) {
    listEl.innerHTML = `<div class="empty">검색 실패: ${escapeHtml(e.message)}</div>`;
    return;
  }
  render();
}

document.getElementById("searchBtn").addEventListener("click", runSearch);
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") runSearch();
});
document.getElementById("searchClearBtn").addEventListener("click", () => {
  activeSearch = null;
  currentPage = 1;
  document.getElementById("searchInput").value = "";
  document.getElementById("searchClearBtn").hidden = true;
  render();
});

loadCompanies();
render();
</script>
</body>
</html>
