<title>MSIT Notice Matcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e3e1db;
  --ink: #1c1b18;
  --muted: #6f6c63;
  --accent: #1f5f4f;
  --accent-fg: #ffffff;
  --tag-bg: #eaf1ee;
  --tag-fg: #1f5f4f;
  --good: #1f7a4d;
  --good-bg: #e6f2ea;
  --warn: #a6660a;
  --warn-bg: #fbf0dd;
  --low: #8b8779;
  --low-bg: #eeecE4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15160f;
    --surface: #1d1e16;
    --border: #34352a;
    --ink: #ece9df;
    --muted: #9d9a8d;
    --accent: #6fbf9e;
    --accent-fg: #0b1a14;
    --tag-bg: #1f2a22;
    --tag-fg: #8fd6b6;
    --good: #6fbf9e;
    --good-bg: #17281f;
    --warn: #e0a94a;
    --warn-bg: #2b2214;
    --low: #7c7a6e;
    --low-bg: #232319;
  }
}
:root[data-theme="dark"] {
  --bg: #15160f;
  --surface: #1d1e16;
  --border: #34352a;
  --ink: #ece9df;
  --muted: #9d9a8d;
  --accent: #6fbf9e;
  --accent-fg: #0b1a14;
  --tag-bg: #1f2a22;
  --tag-fg: #8fd6b6;
  --good: #6fbf9e;
  --good-bg: #17281f;
  --warn: #e0a94a;
  --warn-bg: #2b2214;
  --low: #7c7a6e;
  --low-bg: #232319;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", "Noto Sans KR", -apple-system, sans-serif;
  padding: 40px 24px 80px;
}

.wrap { max-width: 920px; margin: 0 auto; }

header { margin-bottom: 28px; }
.eyebrow {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin: 0 0 6px;
}
h1 {
  font-family: "Space Grotesk", "Noto Sans KR", sans-serif;
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 6px;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
.sub { color: var(--muted); font-size: 14px; margin: 0; }

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 24px 0 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tab:hover { border-color: var(--accent); }
.tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

select#companyFilter {
  margin-left: auto;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  max-width: 220px;
}

.list { display: flex; flex-direction: column; gap: 10px; }

.card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  padding: 16px 18px;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.card a.title {
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
}
.card a.title:hover { color: var(--accent); text-decoration: underline; }

.meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-fg);
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
}
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-pill.open { background: var(--good-bg); color: var(--good); }
.status-pill.upcoming { background: var(--warn-bg); color: var(--warn); }
.status-pill.closed { background: var(--low-bg); color: var(--low); }
.status-pill.unknown { background: var(--low-bg); color: var(--low); }

.score {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  flex-shrink: 0;
}
.score.high { color: var(--good); }
.score.mid { color: var(--warn); }
.score.low { color: var(--low); }
.score .num { font-size: 17px; }

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px 16px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.fact { font-size: 12.5px; line-height: 1.4; }
.fact-label {
  color: var(--muted);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: block;
  margin-bottom: 2px;
}
.fact-value { color: var(--ink); font-variant-numeric: tabular-nums; }

.rationale {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  line-height: 1.5;
}
.notes {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 8px;
  font-style: italic;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 48px 0;
  text-align: center;
}

@media (max-width: 520px) {
  select#companyFilter { margin-left: 0; width: 100%; }
}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Sparklabs · Portfolio Intelligence</p>
    <h1>MSIT Notice Matcher</h1>
    <p class="sub">과학기술정보통신부 사업공고를 자동 수집하고, 예산·자격·마감일을 추출해 포트폴리오사와의 적합도를 AI로 채점합니다.</p>
  </header>

  <div class="controls">
    <div class="tabs" id="statusTabs">
      <button class="tab active" data-status="">전체</button>
      <button class="tab" data-status="open">접수중</button>
      <button class="tab" data-status="upcoming">접수예정</button>
      <button class="tab" data-status="closed">마감</button>
    </div>
    <select id="companyFilter">
      <option value="">전체 공고 보기</option>
    </select>
  </div>

  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
</div>

<script>
const SUPABASE_URL = "https://kxumdmcscyfxxytrugnb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dW1kbWNzY3lmeHh5dHJ1Z25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTQzNDUsImV4cCI6MjEwMjY5MDM0NX0.ptIUfBtvlHiaUVKM10MvxAd0gEyxs3KKozS3FfPqqpk";

let currentStatus = "";
let currentCompany = "";

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function scoreClass(s) {
  if (s >= 70) return "high";
  if (s >= 40) return "mid";
  return "low";
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const statusLabel = { open: "접수중", upcoming: "접수예정", closed: "마감", unknown: "미확인" };

function computeStatus(n) {
  // Deadlines are real dates, so compute freshness live instead of trusting a status
  // written once at extraction time (which goes stale the moment the deadline passes).
  if (n.application_deadline) {
    const today = new Date().toISOString().slice(0, 10);
    return n.application_deadline >= today ? "open" : "closed";
  }
  return n.application_status ?? "unknown";
}

async function loadCompanies() {
  try {
    const companies = await sb("portfolio_companies?select=id,name&active=eq.true&order=name");
    const sel = document.getElementById("companyFilter");
    for (const c of companies) {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name + " 매칭 보기";
      sel.appendChild(opt);
    }
  } catch (e) {
    console.error(e);
  }
}

function factRow(label, value) {
  if (!value) return "";
  return `<div class="fact"><span class="fact-label">${escapeHtml(label)}</span><span class="fact-value">${escapeHtml(value)}</span></div>`;
}

async function render() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';

  let notices = [];
  try {
    if (currentCompany) {
      const matches = await sb(
        `notice_matches?select=notice_id,relevance_score,rationale,notices(*)&company_id=eq.${currentCompany}&order=relevance_score.desc&limit=150`
      );
      notices = matches.filter((m) => m.notices).map((m) => ({ ...m.notices, relevance_score: m.relevance_score, rationale: m.rationale }));
    } else {
      notices = await sb(`notices?select=*&order=posted_at.desc&limit=150`);
    }
  } catch (e) {
    listEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    return;
  }

  if (currentStatus) notices = notices.filter((n) => computeStatus(n) === currentStatus);

  if (!notices.length) {
    listEl.innerHTML = '<div class="empty">해당하는 공고가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = notices.map((n) => {
    const status = computeStatus(n);
    const facts = [
      factRow("총 사업예산", n.total_budget),
      factRow("기업당 지원한도", n.support_cap_per_company),
      factRow("자기부담 비율", n.self_funding_ratio),
      factRow("실질 지원금액", n.actual_support_amount),
      factRow("지원 형태", n.support_type),
      factRow("지급 방식", n.payment_method),
      factRow("선정 규모", n.selection_scale),
      factRow("사업 수행기간", n.project_period),
      factRow("신청자격", n.eligibility),
      factRow("신청 마감일", n.application_deadline),
    ].join("");

    return `
    <div class="card">
      <div class="card-top">
        <a class="title" href="${escapeHtml(n.detail_url)}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
        ${n.relevance_score != null ? `<span class="score ${scoreClass(n.relevance_score)}"><span class="num">${n.relevance_score}</span>/100</span>` : ""}
      </div>
      <div class="meta">
        <span class="status-pill ${escapeHtml(status)}">${escapeHtml(statusLabel[status] ?? status)}</span>
        ${n.dept ? `<span>${escapeHtml(n.dept)}</span>` : ""}
        ${n.posted_at ? `<span>${escapeHtml(n.posted_at)}</span>` : ""}
      </div>
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${n.rationale ? `<div class="rationale">${escapeHtml(n.rationale)}</div>` : ""}
      ${n.extraction_notes ? `<div class="notes">${escapeHtml(n.extraction_notes)}</div>` : ""}
    </div>
  `;
  }).join("");
}

document.getElementById("statusTabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
  tab.classList.add("active");
  currentStatus = tab.dataset.status;
  render();
});

document.getElementById("companyFilter").addEventListener("change", (e) => {
  currentCompany = e.target.value;
  render();
});

loadCompanies();
render();
</script>
